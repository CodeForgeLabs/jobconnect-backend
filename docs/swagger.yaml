basePath: /api/v1
definitions:
  domain.Availability:
    enum:
    - FULLTIME
    - PARTTIME
    - CONTRACT
    - NOT_AVAILABLE
    type: string
    x-enum-varnames:
    - AvailabilityFullTime
    - AvailabilityPartTime
    - AvailabilityContract
    - AvailabilityNotAvailable
  domain.ExperienceLevel:
    enum:
    - ENTRY
    - INTERMEDIATE
    - SENIOR
    type: string
    x-enum-varnames:
    - ExpEntry
    - ExpIntermediate
    - ExpSenior
  domain.Job:
    properties:
      applications_count:
        type: integer
      budget:
        description: fixed job fields
        type: number
      category:
        type: string
      company_name:
        description: company / private
        type: string
      created_at:
        type: string
      created_by:
        description: relationships
        type: integer
      deadline:
        type: string
      description:
        type: string
      experience_level:
        $ref: '#/definitions/domain.ExperienceLevel'
      hourly_rate:
        description: hourly job fields
        type: number
      id:
        type: integer
      is_private:
        type: boolean
      job_type:
        allOf:
        - $ref: '#/definitions/domain.JobType'
        description: classification
      location:
        description: location (only for onsite/hybrid)
        type: string
      max_weekly_hours:
        type: integer
      milestones:
        items:
          $ref: '#/definitions/domain.Milestone'
        type: array
      skills:
        description: skills (simple version)
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.JobStatus'
        description: status + tracking
      title:
        description: core info
        type: string
      updated_at:
        type: string
      work_mode:
        $ref: '#/definitions/domain.WorkMode'
    type: object
  domain.JobStatus:
    enum:
    - OPEN
    - CLOSED
    - DRAFT
    type: string
    x-enum-varnames:
    - StatusOpen
    - StatusClosed
    - StatusDraft
  domain.JobType:
    enum:
    - HOURLY
    - FIXED
    type: string
    x-enum-varnames:
    - JobTypeHourly
    - JobTypeFixed
  domain.Milestone:
    properties:
      amount:
        type: number
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_paid:
        type: boolean
      job_id:
        type: integer
    type: object
  domain.Role:
    enum:
    - CLIENT
    - FREELANCER
    - ADMIN
    type: string
    x-enum-varnames:
    - RoleClient
    - RoleFreelancer
    - RoleAdmin
  domain.User:
    properties:
      availability:
        $ref: '#/definitions/domain.Availability'
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      headline:
        description: Optional onboarding/profile
        type: string
      hourly_rate:
        type: number
      id:
        type: integer
      last_name:
        type: string
      location:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.Role'
        description: Registration (required)
      skills:
        description: store as comma-separated or JSON
        type: string
      updated_at:
        type: string
    type: object
  domain.WorkMode:
    enum:
    - REMOTE
    - ONSITE
    - HYBRID
    type: string
    x-enum-varnames:
    - WorkModeRemote
    - WorkModeOnsite
    - WorkModeHybrid
  handlers.CreateJobRequest:
    properties:
      budget:
        type: number
      category:
        type: string
      company_name:
        type: string
      description:
        type: string
      experience_level:
        type: string
      hourly_rate:
        type: number
      is_private:
        type: boolean
      job_type:
        type: string
      location:
        type: string
      max_weekly_hours:
        type: integer
      milestones:
        items:
          $ref: '#/definitions/handlers.MilestoneRequest'
        type: array
      skills:
        items:
          type: string
        type: array
      title:
        type: string
      work_mode:
        type: string
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.MilestoneRequest:
    properties:
      amount:
        type: number
      description:
        type: string
    type: object
  handlers.UpdateJobRequest:
    properties:
      budget:
        type: number
      category:
        type: string
      company_name:
        type: string
      description:
        type: string
      experience_level:
        type: string
      hourly_rate:
        type: number
      is_private:
        type: boolean
      job_type:
        type: string
      location:
        type: string
      max_weekly_hours:
        type: integer
      skills:
        items:
          type: string
        type: array
      status:
        type: string
      title:
        type: string
      work_mode:
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      availability:
        $ref: '#/definitions/domain.Availability'
      bio:
        type: string
      email:
        type: string
      first_name:
        type: string
      headline:
        type: string
      hourly_rate:
        type: number
      last_name:
        type: string
      location:
        type: string
      password:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      skills:
        items:
          type: string
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for Job Connect platform
  title: Job Connect API
  version: "1.0"
paths:
  /jobs:
    get:
      parameters:
      - description: Title
        in: query
        name: title
        type: string
      - description: Category
        in: query
        name: category
        type: string
      - description: Job Type
        in: query
        name: job_type
        type: string
      - description: Work Mode
        in: query
        name: work_mode
        type: string
      - description: Experience Level
        in: query
        name: experience_level
        type: string
      - description: Minimum Budget
        in: query
        name: budget_min
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Job'
            type: array
      summary: List jobs with filters
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Job
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Job'
      summary: Create job
      tags:
      - Jobs
  /jobs/{id}:
    delete:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete job
      tags:
      - Jobs
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Job'
      summary: Get job by ID
      tags:
      - Jobs
    patch:
      consumes:
      - application/json
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Job
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Job'
      summary: Update job
      tags:
      - Jobs
  /users/email:
    get:
      description: Retrieve user profile using email
      parameters:
      - description: User email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Email required
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
      summary: Get user by email
      tags:
      - Users
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT cookie
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            type: string
        "401":
          description: Invalid email or password
          schema:
            type: string
      summary: Login user
      tags:
      - Users
  /users/me:
    delete:
      description: Delete logged-in user account
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Delete failed
          schema:
            type: string
      summary: Delete current user
      tags:
      - Users
    get:
      description: Retrieve logged-in user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
      summary: Get current user profile
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Update user profile fields partially
      parameters:
      - description: User update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Update failed
          schema:
            type: string
      summary: Update current user
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            type: string
        "500":
          description: Failed to create user
          schema:
            type: string
      summary: Register new user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: cookie
    name: token
    type: apiKey
swagger: "2.0"
